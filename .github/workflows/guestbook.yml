name: Guestbook Entry

on:
  issues:
    types: [opened]

jobs:
  process-guestbook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Label and assign guestbook issue
        id: check-guestbook
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title;
            
            // Check if this is a guestbook issue
            if (!title.toLowerCase().includes('guestbook')) {
              console.log('Not a guestbook issue, skipping');
              core.setOutput('is_guestbook', 'false');
              return;
            }
            
            core.setOutput('is_guestbook', 'true');
            
            // Add the guestbook label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['guestbook']
            });
            console.log('Added guestbook label');
            
            // Assign to repository owner
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [context.repo.owner]
            });
            console.log(`Assigned issue to ${context.repo.owner}`);

      - name: Checkout repository
        if: steps.check-guestbook.outputs.is_guestbook == 'true'
        uses: actions/checkout@v4

      - name: Create branch and PR
        if: steps.check-guestbook.outputs.is_guestbook == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title;
            
            // Check if "from" exists in the title
            const fromIndex = title.toLowerCase().indexOf('from');
            if (fromIndex === -1) {
              console.log('No "from" in title, stopping here');
              return;
            }
            
            // Extract the name after "from"
            const nameAfterFrom = title.slice(fromIndex + 4).trim();
            if (!nameAfterFrom) {
              console.log('No name found after "from", stopping here');
              return;
            }
            
            // Sanitize the name for use in branch name
            const sanitizedName = nameAfterFrom
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '');
            
            const branchName = `guestbook-${sanitizedName}`;
            
            // Get the default branch's latest commit SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });

            // Create a new branch from main
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: ref.object.sha
              });
              console.log(`Created branch: ${branchName}`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Branch ${branchName} already exists`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `A branch for this guestbook entry already exists (\`${branchName}\`). Please check if there's already a PR for this entry.`
                });
                return;
              }
              throw error;
            }
            
            // Get the current guestbook file
            const filePath = 'public/guestbook-entries.json';
            let entries = [];
            let fileSha = null;
            
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                ref: branchName
              });
              fileSha = file.sha;
              const content = Buffer.from(file.content, 'base64').toString('utf8');
              entries = JSON.parse(content);
            } catch (error) {
              console.log('Guestbook file not found, starting with empty array');
              entries = [];
            }
            
            // Parse issue body for entry data
            const body = issue.body || '';

            // Extract name (fallback to title if not in body)
            const nameMatch = body.match(/\*\*Name:\*\*\s*(.+)/);
            const parsedName = nameMatch ? nameMatch[1].trim() : nameAfterFrom;

            // Extract message (required)
            const messageMatch = body.match(/\*\*Message:\*\*\s*\n([\s\S]+)/);
            const parsedMessage = messageMatch ? messageMatch[1].trim() : '';

            // Extract website (optional)
            const websiteMatch = body.match(/\*\*Website:\*\*\s*(.+)/);
            const parsedWebsite = websiteMatch ? websiteMatch[1].trim() : null;

            // Validate required fields
            if (!parsedName || !parsedMessage) {
              console.log('Missing required fields (name or message), cannot create entry');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Unable to process guestbook entry: Missing required fields (name or message). Please ensure your issue follows the correct format.'
              });
              return;
            }

            // Generate dynamic ID
            const newId = entries.length > 0 ? Math.max(...entries.map(e => e.id)) + 1 : 1;

            // Create entry with actual data
            const newEntry = {
              id: newId,
              name: parsedName,
              message: parsedMessage,
              date: issue.created_at
            };

            // Only add website if it exists
            if (parsedWebsite) {
              newEntry.website = parsedWebsite;
            }

            entries.push(newEntry);
            
            // Update the file
            const updateParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `Add guestbook entry for issue #${issue.number}`,
              content: Buffer.from(JSON.stringify(entries, null, 2)).toString('base64'),
              branch: branchName
            };
            
            if (fileSha) {
              updateParams.sha = fileSha;
            }
            
            await github.rest.repos.createOrUpdateFileContents(updateParams);
            console.log('Updated guestbook file');
            
            // Create a pull request
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Guestbook entry: ${nameAfterFrom}`,
              head: branchName,
              base: 'main',
              body: `This PR adds a guestbook entry.\n\nCloses #${issue.number}`
            });
            console.log(`Created PR #${pr.number}`);
            
            // Comment on the issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Thanks for signing the guestbook! 🎉\n\nA PR has been created: #${pr.number}`
            });